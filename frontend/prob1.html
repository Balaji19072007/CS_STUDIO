  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  animation: slideInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

.rating-popup {
  background: var(--popup-bg);
  border-radius: 20px;
  box-shadow:
    0 20px 60px -5px rgba(0, 0, 0, 0.4),
    0 8px 20px -6px rgba(0, 0, 0, 0.2),
    0 0 0 1px var(--popup-border);
  width: 400px;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transform: translateZ(0);
  /* Hardware acceleration */
}

@keyframes slideInUp {
  from {
    transform: translateY(100px) scale(0.95);
    opacity: 0;
  }

  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

.popup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  background: transparent;
  border: 0px solid transparent !important;
  border-bottom: 0px solid transparent !important;
  box-shadow: none !important;
  outline: none !important;
  position: relative;
}

.popup-header::after,
.popup-header::before {
  display: none !important;
  content: none !important;
  border: none !important;
}

.header-content {
  display: flex;
  align-items: center;
  gap: 14px;
}

.icon-wrapper {
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.sparkle-icon {
  color: white;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
}

.header-text {
  flex: 1;
}

.header-text h3 {
  margin: 0 0 2px 0;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
  background: transparent !important;
}

.header-text p {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.4;
  font-weight: 500;
  background: transparent !important;
}

.close-btn {
  background: rgba(255, 255, 255, 0.05);
  border: none;
  color: var(--text-tertiary);
  width: 32px;
  height: 32px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
  margin-left: 12px;
}

.close-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-primary);
  transform: rotate(90deg);
}

.popup-body {
  padding: 24px;
}

.rating-section {
  margin-bottom: 24px;
  text-align: center;
}

.rating-label {
  display: block;
  margin-bottom: 16px;
  color: var(--text-primary);
  font-size: 1rem;
  font-weight: 600;
}

.rating-stars {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
}

.star-icon {
  color: var(--star-empty);
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  /* Bouncy transition */
  padding: 4px;
  width: 36px;
  height: 36px;
}

.star-icon:hover {
  transform: scale(1.2);
}

.star-icon.filled {
  color: var(--star-filled);
  filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.4));
}

.star-icon.hovered {
  color: var(--star-hover);
  transform: scale(1.2);
  filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
}

.rating-labels {
  display: flex;
  justify-content: space-between;
  padding: 0 10px;
  color: var(--text-tertiary);
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.feedback-section {
  margin-bottom: 20px;
}

.feedback-label {
  display: block;
  margin-bottom: 8px;
  color: var(--text-secondary);
  font-size: 0.875rem;
  font-weight: 500;
}

.feedback-textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--input-border);
  border-radius: 12px;
  resize: none;
  font-family: inherit;
  font-size: 0.9rem;
  transition: all 0.2s ease;
  background: var(--input-bg);
  color: var(--text-primary);
  min-height: 90px;
}

.feedback-textarea:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 4px var(--focus-ring);
  background: var(--input-bg-focus);
}

.feedback-textarea::-moz-placeholder {
  color: var(--text-tertiary);
}

.feedback-textarea::placeholder {
  color: var(--text-tertiary);
}

.char-count {
  text-align: right;
  font-size: 0.75rem;
  color: var(--text-tertiary);
  margin-top: 6px;
  font-weight: 500;
}

.message {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 0.875rem;
  text-align: center;
  margin-bottom: 16px;
  font-weight: 600;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.success {
  background: var(--success-bg);
  color: var(--success-color);
  border: 1px solid var(--success-border);
}

.message.error {
  background: var(--error-bg);
  color: var(--error-color);
  border: 1px solid var(--error-border);
}

.popup-footer {
  display: flex;
  gap: 12px;
  padding: 20px 24px;
  background: var(--footer-bg);
  border-top: 1px solid var(--popup-border-color);
}

.cancel-btn {
  flex: 1;
  padding: 12px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--popup-border-color);
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.cancel-btn:hover {
  background: var(--button-secondary-hover);
  color: var(--text-primary);
  border-color: var(--text-tertiary);
}

.submit-btn {
  flex: 1.5;
  padding: 12px;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
}

.submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 16px rgba(99, 102, 241, 0.5);
}

.submit-btn:active:not(:disabled) {
  transform: translateY(0);
}

.submit-btn:disabled {
  background: var(--button-disabled-bg);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
  opacity: 0.7;
}

.spinner {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

  .rating-popup-overlay {

/* ============================================ */
/* CRITICAL STRUCTURAL FIX: Global Margins/Padding */
/* ============================================ */
html,
body,
#root {
  opacity: 1 !important;
  visibility: visible !important;
  margin: 0 !important;
  padding: 0 !important;
  width: 100vw;
  min-height: 100vh;
  max-width: 100vw !important;
  overflow-x: hidden;
}
/* Ensure base colors are visible */
html,
body {
  background-color: var(--color-background-dark) !important;
  color: var(--color-text-main) !important;
}
/* Override any invisible text classes */
* {
  opacity: 1;
  visibility: visible;
}
/* ============================================ */
/* PROFESSIONAL THEME REFINEMENTS */
/* ============================================ */
/* Base Variables for Color Management */
:root {
  --color-primary-500: #00a79d;
  --color-primary-600: #008e7b;
  --color-primary-400: #1ee0d0;
  --color-primary-100: #e0f2f2;

  --color-background-dark: #101827;
  --color-background-dark-light: #1c273a;
  --color-background-dark-accent: #29384c;
  --color-background-card: #1c273a;
  --color-background-card-hover: #29384c;
  --color-background-problem-card: #1f2937;
  --color-background-navbar: #101827;
  /* NEW: Navbar specific variable */

  --color-text-main: #e2e8f0;
  --color-text-secondary: #a0aec0;

  --color-border-dark: #374151;
  --color-border-dark-hover: var(--color-primary-500);
  --color-shadow-dark: rgba(0, 0, 0, 0.4);
}
/* --- LIGHT MODE OVERRIDES: Global Class Overrides --- */
body.light-theme {
  --color-background-dark: #ffffff;
  --color-background-dark-light: #f3f4f6;
  --color-background-dark-accent: #e5e7eb;
  --color-background-card: #ffffff;
  --color-background-card-hover: #f9fafb;
  --color-background-problem-card: #ffffff;
  --color-background-navbar: #ffffff;
  /* NEW: Light navbar */

  --color-text-main: #1f2937;
  --color-text-secondary: #4b5563;

  --color-primary-500: #059669;
  --color-primary-600: #047857;
  --color-primary-400: #10b981;
  --color-primary-100: #d1fae5;

  --color-border-dark: #d1d5db;
  --color-border-dark-hover: var(--color-primary-500);
  --color-shadow-dark: rgba(0, 0, 0, 0.15);

  background-color: #ffffff !important;
  color: #1f2937 !important;
}
/* ============================================ */
/* DEFAULT LIGHT THEME SETTINGS */
/* ============================================ */
/* Set light theme as default before any JS runs */
body:not(.dark-theme):not(.light-theme) {
  background-color: #ffffff !important;
  color: #1f2937 !important;
}
/* Ensure light theme is properly applied when no theme class is present */
html:not(.dark) body:not(.dark-theme) {
  background-color: #ffffff !important;
  color: #1f2937 !important;
}
/* Remove any default dark theme settings that might be interfering */
/* ============================================ */
/* PREVENT THEME FLASH */
/* ============================================ */
/* Hide content until theme is loaded */
body:not(.light-theme):not(.dark-theme) {
  visibility: hidden;
}
body.light-theme,
body.dark-theme {
  visibility: visible;
}
/* Ensure smooth transitions globally for theme colors */
*, ::before, ::after {
  transition-property: background-color, border-color, color, fill, stroke;
  transition-duration: 300ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}
/* Exempt elements that need specific all-property transitions (like hover scales) */
.transition-all, .card-hover, .nav-link, button, a {
  transition-property: all !important;
}
/* Tailwind Customizations using CSS Variables for Dynamic Theme Switching */
/* UTILITIES FOR FIXED COLORS (Ignore Theme) */
.text-always-white, .text-always-white * {
  color: #ffffff !important;
}
.text-always-gray-400 {
  color: #9ca3af !important;
}
/* --- NAVBAR SPECIFIC FIXES --- */
.navbar-container,
nav,
header,
[class*="navbar"],
[class*="header"] {
  background-color: var(--color-background-navbar) !important;
  border-bottom: 1px solid var(--color-border-dark) !important;
  transition: all 0.3s ease-in-out;
}
/* Ensure navbar text colors are theme-aware */
.navbar-container *,
nav *,
header * {

}
.nav-link:hover {

/* ============================================ */
/* SKELETON ANIMATIONS */
/* ============================================ */
@keyframes shimmer {
  0% {
    transform: translateX(-100%);
  }
  100% {
    transform: translateX(100%);
  }
}
.animate-shimmer {
  animation: shimmer 2s infinite;
}
/* Skeleton bounce dots */
.skeleton-dots {
  display: flex;
  align-items: center;
  gap: 4px;
}
.skeleton-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: #3b82f6;
  animation: skeleton-bounce 1.4s ease-in-out infinite both;
}
.skeleton-dot:nth-child(1) { animation-delay: -0.32s; }
.skeleton-dot:nth-child(2) { animation-delay: -0.16s; }
.skeleton-dot:nth-child(3) { animation-delay: 0s; }
@keyframes skeleton-bounce {
  0%, 80%, 100% {
    transform: scale(0);
    opacity: 0.5;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}
/* ============================================ */
/* ENHANCED TRANSITIONS */
/* ============================================ */
.animate-in {
  animation: animate-in 0.3s ease-out;
}
.fade-in {
  animation-name: fade-in;
}
.zoom-in {
  animation-name: zoom-in;
}
.slide-in-from-bottom-4 {
  animation-name: slide-in-from-bottom-4;
}
.slide-in-from-top {
  animation-name: slide-in-from-top;
}
.slide-in-from-left {
  animation-name: slide-in-from-left;
}
.slide-in-from-right {
  animation-name: slide-in-from-right;
}
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes zoom-in {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes slide-in-from-bottom-4 {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes slide-in-from-top {
  from { transform: translateY(-16px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes slide-in-from-left {
  from { transform: translateX(-16px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slide-in-from-right {
  from { transform: translateX(16px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
/* Stagger animations for lists */
.stagger-children > * {
  opacity: 0;
  animation: fade-in 0.4s ease-out forwards;
}
.stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
.stagger-children > *:nth-child(2) { animation-delay: 0.1s; }
.stagger-children > *:nth-child(3) { animation-delay: 0.15s; }
.stagger-children > *:nth-child(4) { animation-delay: 0.2s; }
.stagger-children > *:nth-child(5) { animation-delay: 0.25s; }
.stagger-children > *:nth-child(6) { animation-delay: 0.3s; }
.stagger-children > *:nth-child(7) { animation-delay: 0.35s; }
.stagger-children > *:nth-child(8) { animation-delay: 0.4s; }
.stagger-children > *:nth-child(9) { animation-delay: 0.45s; }
.stagger-children > *:nth-child(10) { animation-delay: 0.5s; }
/* Page transition wrapper */
.page-enter {
  animation: page-enter 0.35s ease-out;
}
@keyframes page-enter {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
/* Navigation progress bar - indeterminate shimmer */
.progress-indeterminate {
  animation: progress-indeterminate 1.8s ease-in-out infinite;
}
@keyframes progress-indeterminate {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(0%); }
  100% { transform: translateX(100%); }
}
/* Pulse slow for backgrounds */
.animate-pulse-slow {
  animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}
@keyframes pulse-slow {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.1; }
}
/* Bounce slow */
.animate-bounce-slow {
  animation: bounce-slow 2s infinite;
}
@keyframes bounce-slow {
  0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
  50% { transform: translateY(-6px); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
}
/* Success check animation */
.animate-check {
  stroke-dasharray: 50;
  stroke-dashoffset: 50;
  animation: draw-check 0.5s ease-out forwards;
}
@keyframes draw-check {
  to { stroke-dashoffset: 0; }
}
/* ============================================ */
/* ACCESSIBILITY IMPROVEMENTS */
/* ============================================ */
/* Focus-visible: only show focus ring on keyboard navigation */
*:focus-visible {
  outline: 2px solid #3b82f6;
  outline-offset: 2px;
  border-radius: 4px;
}
/* Remove focus ring for mouse clicks */
*:focus:not(:focus-visible) {
  outline: none;
}
/* Skip to main content link */
.skip-to-content {
  position: absolute;
  top: -100%;
  left: 0;
  z-index: 1000;
  padding: 1rem;
  background: #3b82f6;
  color: white;
  text-decoration: none;
}
.skip-to-content:focus {
  top: 0;
}
/* Reduced motion preference */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
/* High contrast mode adjustments */
@media (prefers-contrast: high) {
  body {
    --color-text-main: #000000;
    --color-background-dark: #ffffff;
  }
}

  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

  position: static;
