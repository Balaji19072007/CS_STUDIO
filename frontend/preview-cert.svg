<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1131" viewBox="0 0 1600 1131" role="img" aria-label="CS Studio Certificate">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient for Borders -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1131" fill="url(#bgGradient)" />

  <!-- Borders -->
  <rect x="50" y="50" width="1500" height="1031" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="65" y="65" width="1470" height="1001" fill="none" stroke="url(#accentGradient)" stroke-width="6" />
  <rect x="75" y="75" width="1450" height="981" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Corner Decorations -->
  <!-- Top Left -->
  <path d="M 65 150 L 65 65 L 150 65" fill="none" stroke="#38bdf8" stroke-width="8" />
  <!-- Top Right -->
  <path d="M 1450 65 L 1535 65 L 1535 150" fill="none" stroke="#38bdf8" stroke-width="8" />
  <!-- Bottom Left -->
  <path d="M 65 981 L 65 1066 L 150 1066" fill="none" stroke="#38bdf8" stroke-width="8" />
  <!-- Bottom Right -->
  <path d="M 1535 981 L 1535 1066 L 1450 1066" fill="none" stroke="#38bdf8" stroke-width="8" />

  <!-- Glowing Orb behind title -->
  <circle cx="800" cy="320" r="300" fill="#0ea5e9" opacity="0.08" filter="url(#glow)" />

  <!-- Branding -->
  <text x="800" y="180" text-anchor="middle" fill="url(#accentGradient)" font-family="system-ui, sans-serif" font-weight="800" font-size="36" letter-spacing="14">CS STUDIO</text>
  
  <!-- Main Title -->
  <text x="800" y="320" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="6">CERTIFICATE OF COMPLETION</text>

  <!-- Subtitle -->
  <text x="800" y="440" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24" letter-spacing="4">THIS IS PROUDLY PRESENTED TO</text>

  <!-- Learner Name -->
  <text x="800" y="580" text-anchor="middle" fill="#0ea5e9" font-family="system-ui, sans-serif" font-weight="bold" font-size="84">John Doe</text>

  <!-- Divider Lines -->
  <line x1="550" y1="640" x2="1050" y2="640" stroke="#1e293b" stroke-width="2" />
  <line x1="750" y1="640" x2="850" y2="640" stroke="#0ea5e9" stroke-width="6" />

  <!-- Course text -->
  <text x="800" y="730" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24">For successfully completing the comprehensive learning path in</text>
  
  <text x="800" y="800" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="46">Advanced Data Structures in C++</text>

  <!-- Footer Elements -->
  
  <!-- Left Side: Date and ID -->
  <g transform="translate(180, 920)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" text-transform="uppercase" letter-spacing="2">Date of Issue</text>
    <text x="0" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">19 June 2026</text>

    <text x="0" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" text-transform="uppercase" letter-spacing="2">Certificate ID</text>
    <text x="0" y="125" fill="#f8fafc" font-family="monospace" font-size="22">CERT-1234-5678</text>
    <text x="0" y="160" fill="#334155" font-family="system-ui, sans-serif" font-size="14"></text>
  </g>

  <!-- Center-Right: Signature -->
  <g transform="translate(950, 900)">
    <!-- Elegant stylized signature -->
    <path d="M 0,40 C 30,-10 40,-10 50,40 C 60,90 70,-30 90,-20 C 110,-10 100,40 120,30 C 140,20 150,-20 160,20 C 170,60 180,30 190,20 C 200,10 210,20 220,40" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 230,20 C 240,0 250,30 260,15" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" />
    
    <!-- Underline -->
    <line x1="-30" y1="60" x2="290" y2="60" stroke="#334155" stroke-width="2" />
    
    <text x="130" y="95" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Alex Developer</text>
    <text x="130" y="125" text-anchor="middle" fill="#0ea5e9" font-family="system-ui, sans-serif" font-size="18">Founder, CS Studio</text>
  </g>

  <!-- Far Right: Stamp/Seal -->
  <g transform="translate(1380, 940)">
    <!-- Glow behind stamp -->
    <circle cx="0" cy="0" r="80" fill="#0ea5e9" opacity="0.15" filter="url(#glow)" />
    
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="90" fill="#020617" stroke="#0ea5e9" stroke-width="2" />
    <!-- Dashed Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="72" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    
    <!-- Circular Text -->
    <path id="circleTextPath" d="M 0, -58 A 58, 58 0 1, 1 -0.1, -58" fill="none" />
    <text font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" letter-spacing="4">
      <textPath href="#circleTextPath" startOffset="50%" text-anchor="middle">
        OFFICIAL • CS STUDIO • VERIFIED •
      </textPath>
    </text>
    
    <!-- Inner Icon (Shield / Badge) -->
    <path d="M 0 -25 L 18 -10 L 18 12 L 0 28 L -18 12 L -18 -10 Z" fill="none" stroke="#0ea5e9" stroke-width="3" />
    <!-- Checkmark inside shield -->
    <path d="M -7 5 L -2 10 L 8 -5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

</svg>